[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clade"
version = "0.1.0"
description = "CLADE: Clonal-Lineage-Aware Detection of Epistasis — a six-stage framework for validating candidate compensatory mutations in clonal bacterial populations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Pooja B.N" }
]
keywords = ["bioinformatics", "phylogenetics", "population-genetics", "antimicrobial-resistance", "bacterial-gwas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3,<1.6",
    "dendropy>=5.0",
    "tabulate>=0.9",
]

[project.urls]
Homepage = "https://github.com/biocoderep/clade"
Repository = "https://github.com/biocoderep/clade"
Issues = "https://github.com/biocoderep/clade/issues"

[project.optional-dependencies]
firth = ["firthlogist"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
clade = "clade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
