name: Nextflow pipeline

on:
  push:
    branches: [main]
    paths: ['workflows/nextflow/**', '.github/workflows/nextflow-stub-test.yml']
  pull_request:
    paths: ['workflows/nextflow/**', '.github/workflows/nextflow-stub-test.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stub-run:
    name: Stub run (NF ${{ matrix.nxf_ver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version and the current release. The floor is
        # declared in the manifest, so it should be tested, not assumed.
        nxf_ver: ['23.04.0', 'latest-stable']

    steps:
      - uses: actions/checkout@v4

      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nxf_ver }}

      # The whole DAG runs with no tools, no data and no network: every
      # process, every channel join, every filename expectation. It is a wiring
      # test. Scientific correctness is covered by the pytest suite, where the
      # expected answer is known by construction.
      - name: Stub-run the full pipeline
        working-directory: workflows/nextflow
        run: nextflow run main.nf -profile test -stub-run

      - name: Re-run with -resume (must cache, not recompute)
        working-directory: workflows/nextflow
        run: nextflow run main.nf -profile test -stub-run -resume

      - name: Check the expected outputs exist
        working-directory: workflows/nextflow
        run: |
          for f in results/clade/clade_evidence_table.md \
                   results/clade/clade_evidence_table.tsv \
                   results/clade_input/genotypes.csv \
                   results/phylogeny/tree.nwk \
                   results/pipeline_info/software_versions.yml; do
            [ -s "$f" ] || { echo "MISSING or empty: $f"; exit 1; }
          done
          echo "All expected outputs present."

  config-profiles:
    name: Every profile resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2

      # A profile that fails to resolve is a broken promise in the README.
      - name: Resolve each documented profile
        working-directory: workflows/nextflow
        run: |
          for p in docker singularity apptainer podman conda mamba local slurm; do
            echo "--- $p ---"
            nextflow config -profile test,$p . > /dev/null || { echo "profile $p FAILED"; exit 1; }
          done
          echo "All profiles resolve."

      - name: Validate the parameter schema is well-formed JSON
        working-directory: workflows/nextflow
        run: python3 -c "import json; json.load(open('nextflow_schema.json')); print('schema OK')"
